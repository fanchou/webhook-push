[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "webhook-push"
version = "0.1.0"
description = "Unified webhook messaging skill for WeCom, DingTalk, and Feishu platforms"
authors = ["Webhook Push Skill Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/fanchou/webhook-push"
repository = "https://github.com/fanchou/webhook-push"
documentation = "https://github.com/fanchou/webhook-push/tree/main/docs"
keywords = ["webhook", "wecom", "dingtalk", "feishu", "messaging", "notification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9"

# HTTP client
httpx = { version = ">=0.25.0", extras = ["http2"] }

# Configuration
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.1"

# Utilities
python-dateutil = "^2.8.2"
tenacity = "^8.2.0"

# For MCP compatibility
mcp = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.25.0"
black = "^23.11.0"
isort = "^5.12.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
types-pyyaml = "^6.0.12"

[tool.poetry.scripts]
webhook-push = "webhook_push.cli:main"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "C4", "A", "PL", "PIE", "SIM", "ARG"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
